[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "port-bridge"
version = "0.1.3"
description = "A cross-platform GUI bridge that exposes serial and CAN bus hardware over TCP."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["CAN", "serial", "bridge", "TCP", "embedded", "hardware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: System :: Networking",
]
dependencies = [
    "pyserial>=3.5",
    "python-can>=4.0",
    "gs_usb>=0.3.0",
    "libusb>=1.0.27",
    "libusb-package>=1.0.26.1",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.0",
]

[project.scripts]
port-bridge     = "portbridge.__main__:main"
port-bridge-gui = "portbridge.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["portbridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH"]
ignore = ["B008", "B009", "B010"]

[tool.mypy]
python_version = "3.10"
files = ["portbridge"]
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["portbridge.gui.*"]
ignore_errors = true
