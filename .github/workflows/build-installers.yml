name: Build Installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to upload artifacts to (e.g. v0.1.1)
        required: true
        type: string

permissions:
  contents: read

env:
  # For release events the tag comes from the event; for manual runs use the input.
  APP_VERSION: ${{ github.event.release.tag_name || inputs.tag_name }}

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: pip install -e ".[gui]" pyinstaller

      - name: Generate icon files
        run: python scripts/generate_icon.py

      - name: Build with PyInstaller
        run: pyinstaller portbridge-gui.spec

      # Inno Setup is pre-installed on windows-latest runners.
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = "${{ env.APP_VERSION }}".TrimStart("v")
          iscc installer/windows/setup.iss /DAppVersion=$ver
          $src  = "installer-output\port-bridge-$ver-windows-setup.exe"
          $dest = "port-bridge-$ver-windows-setup.exe"
          Move-Item $src $dest
          "INSTALLER=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.APP_VERSION }}
          files: ${{ env.INSTALLER }}

  # ── Linux ─────────────────────────────────────────────────────────────────
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python dependencies
        run: pip install -e ".[gui]" pyinstaller

      - name: Generate icon files
        # QT_QPA_PLATFORM=offscreen renders QPixmap without a real display.
        run: QT_QPA_PLATFORM=offscreen python scripts/generate_icon.py

      - name: Build with PyInstaller (onedir)
        run: pyinstaller portbridge-gui.spec

      - name: Download appimagetool
        run: |
          curl -Lo appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r dist/port-bridge-gui/* AppDir/usr/bin/

          cp installer/linux/port-bridge.desktop AppDir/
          cp installer/linux/AppRun AppDir/
          chmod +x AppDir/AppRun

          # Icon name must match Icon= in the .desktop file
          cp assets/icon.png AppDir/port-bridge.png
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/port-bridge.png

      - name: Build AppImage
        run: |
          ver="${{ env.APP_VERSION }}"
          ver="${ver#v}"
          # --appimage-extract-and-run makes appimagetool itself run without
          # FUSE, which is not available on GitHub Actions runners.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            AppDir "port-bridge-${ver}-x86_64.AppImage"
          echo "APPIMAGE=port-bridge-${ver}-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.APP_VERSION }}
          files: ${{ env.APPIMAGE }}
